<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Movie poster placeholder</title>
  <desc id="desc">Default poster used when a movie image is not available.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="55%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#3A0B0F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#bg)"/>
  <rect x="54" y="54" width="692" height="1092" rx="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>
  <circle cx="400" cy="450" r="132" fill="#E50914" fill-opacity="0.18"/>
  <path d="M350 360 L350 540 L515 450 Z" fill="#E50914"/>
  <text x="400" y="690" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle">MovieTicket</text>
  <text x="400" y="750" fill="#B8B8C8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">Add poster in public/posters</text>
</svg>
